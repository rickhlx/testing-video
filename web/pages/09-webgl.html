<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<script type="module">
import { scaffold, button } from '/assets/scaffold.js';
import { Telemetry, Rate, rateClass } from '/assets/telemetry.js';

const { stage, controls, panel, notes } = scaffold('webgl');
const SRC = '/media/h264-1080p24.mp4';

const canvas = document.createElement('canvas');
canvas.width = 1920; canvas.height = 1080;
stage.append(canvas);

const video = document.createElement('video');
Object.assign(video, { src: SRC, muted: true, playsInline: true, loop: true });
video.style.display = 'none';
stage.append(video);

const t = new Telemetry({ mount: panel, video });

const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
if (!gl) {
  t.fail('No WebGL context on this client.');
  t.set('WebGL', 'unavailable', 'v-bad');
} else {
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  t.set('renderer', dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER));

  const compile = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };

  // A single full-screen triangle: no vertex buffer, nothing to measure but the
  // texture upload, which is the point of this page.
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, `
    attribute vec2 p;
    varying vec2 uv;
    void main() {
      uv = vec2((p.x + 1.0) * 0.5, 1.0 - (p.y + 1.0) * 0.5);
      gl_Position = vec4(p, 0.0, 1.0);
    }`));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, `
    precision mediump float;
    uniform sampler2D tex;
    varying vec2 uv;
    void main() { gl_FragColor = texture2D(tex, uv); }`));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) t.fail(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  for (const [k, v] of [[gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE],
                        [gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR]]) {
    gl.texParameteri(gl.TEXTURE_2D, k, v);
  }
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.viewport(0, 0, canvas.width, canvas.height);

  const paintRate = new Rate();
  let painted = 0, uploadMsTotal = 0;

  const paint = () => {
    const t0 = performance.now();
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, video);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    uploadMsTotal += performance.now() - t0;
    painted++;

    const fps = paintRate.sample(painted);
    t.set('paint fps', fps === null ? '--' : fps.toFixed(1), rateClass(fps));
    t.set('frames painted', painted);
    t.set('avg upload+draw', `${(uploadMsTotal / painted).toFixed(2)} ms`,
      uploadMsTotal / painted < 8 ? 'v-ok' : uploadMsTotal / painted < 20 ? 'v-warn' : 'v-bad');

    video.requestVideoFrameCallback(paint);
  };
  video.requestVideoFrameCallback(paint);
  video.play().catch((e) => t.log(`autoplay blocked: ${e.message}; press play`));
}

button(controls, 'play', () => video.play());
button(controls, 'pause', () => video.pause());

notes.innerHTML = `
  <p>Each frame is uploaded as a GL texture and drawn on a full-screen triangle.
     The shader is deliberately trivial so the number being measured is the
     upload.</p>
  <p>Compare against page 07. Some embedded GPUs have a fast path from the video
     decoder into a texture and are markedly quicker here than through canvas 2D;
     others have no such path and are much slower.</p>`;
</script>
</body>
</html>
